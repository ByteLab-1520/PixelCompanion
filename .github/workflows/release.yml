name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate tag and signing configuration
        id: version
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: ${{ github.ref_name }}"
          }

          [xml] $props = Get-Content -LiteralPath 'Directory.Build.props'
          $projectVersion = [string] $props.Project.PropertyGroup.Version
          if ($projectVersion -ne $version) {
            throw "Tag version '$version' does not match project version '$projectVersion'."
          }

          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit contained in origin/main.'
          }

          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required GitHub secret or variable is missing: $name"
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build unsigned Windows installer
        shell: powershell
        run: .\scripts\Build-WindowsInstaller.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Smoke-test unsigned Windows installer
        shell: powershell
        run: .\scripts\Test-WindowsInstaller.ps1 -InstallerPath .\artifacts\windows\installer\PixelCompanion-Installer.exe -Version '${{ steps.version.outputs.version }}'

      - name: Upload unsigned artifact for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: PixelCompanion-Unsigned-Installer-${{ github.ref_name }}
          path: artifacts/windows/installer/PixelCompanion-Installer.exe
          if-no-files-found: error

      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: '${{ github.workspace }}/artifacts/windows/signed'

      - name: Verify signature and finalize release files
        shell: powershell
        run: |
          $signedInstaller = Get-ChildItem -LiteralPath 'artifacts/windows/signed' -Recurse -File -Filter 'PixelCompanion-Installer.exe' |
            Select-Object -First 1
          if ($null -eq $signedInstaller) {
            throw 'SignPath output did not contain PixelCompanion-Installer.exe.'
          }

          .\scripts\Finalize-WindowsRelease.ps1 `
            -SignedInstallerPath $signedInstaller.FullName `
            -Version '${{ steps.version.outputs.version }}'

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelCompanion-Signed-Installer-${{ github.ref_name }}
          path: |
            artifacts/windows/release/PixelCompanion-Installer.exe
            artifacts/windows/release/PixelCompanion-Installer.exe.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            'artifacts/windows/release/PixelCompanion-Installer.exe' `
            'artifacts/windows/release/PixelCompanion-Installer.exe.sha256' `
            --verify-tag `
            --title 'Pixel Companion ${{ github.ref_name }}' `
            --generate-notes
